# Apache vhost for careers.cburrell.com
# Place in /etc/apache2/sites-available/careers.conf
# then: a2ensite careers && systemctl reload apache2
#
# Prerequisites (run once if not already enabled):
#   a2enmod proxy proxy_http ssl rewrite headers
#
# Replace CONTAINER_IP with the static IP assigned to the LXC container.

<VirtualHost *:80>
    ServerName careers.cburrell.com
    Redirect permanent / https://careers.cburrell.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName careers.cburrell.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/careers.cburrell.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/careers.cburrell.com/privkey.pem
    Include               /etc/letsencrypt/options-ssl-apache.conf

    # Forward all traffic to the Node app in the LXC container
    ProxyPreserveHost On
    ProxyPass        / http://CONTAINER_IP:3000/
    ProxyPassReverse / http://CONTAINER_IP:3000/

    # Pass the real client IP through to the app
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For   "%{REMOTE_ADDR}s"

    ErrorLog  ${APACHE_LOG_DIR}/careers-error.log
    CustomLog ${APACHE_LOG_DIR}/careers-access.log combined
</VirtualHost>
